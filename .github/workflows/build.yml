name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run core tests
        run: dotnet run --project tests/CoreTests -c Release

  build-windows:
    runs-on: windows-latest
    needs: test-core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: dotnet publish src/RobloxModManager/RobloxModManager.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxModManager
          path: publish/RobloxModManager.exe
      - name: Publish exe to the build branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir out && cp publish/RobloxModManager.exe out/
          cd out
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RobloxModManager.exe
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build
